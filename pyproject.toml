[build-system]
requires      = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name            = "pyschlage"
description     = "Python API for interacting with Schlage WiFi locks."
authors         = [
    {name = "David Knowles", email = "dknowles2@gmail.com"},
]
dependencies    = ["aiohttp>=3.9", "pycognito>=2022.11.0", "requests"]
requires-python = ">=3.11"
dynamic         = ["readme", "version"]
license         = {text = "Apache-2.0"}
keywords        = ["schlage", "api", "iot"]
classifiers     = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
ble = ["cbor2>=5.6", "pycryptodome>=3.20"]

[project.urls]
"Homepage"      = "https://github.com/dknowles2/pyschlage"
"Source Code"   = "https://github.com/dknowles2/pyschlage"
"Bug Reports"   = "https://github.com/dknowles2/pyschlage/issues"
"Documentation" = "https://pyschlage.readthedocs.io"

[dependency-groups]
test = [
    "cbor2==5.8.0",
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pycryptodome==3.24.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.10",
    "types-requests==2.33.0.20261006",
]
dev = [
    {include-group = "test"},
    "pre-commit==4.6.2",
]

[tool.setuptools]
platforms            = ["any"]
zip-safe             = true
include-package-data = true

[tool.setuptools.dynamic]
readme          = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "pyschlage/_version.py"

[tool.pytest.ini_options]
addopts = "--timeout=30"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pyschlage"]

[tool.coverage.report]
omit       = ["pyschlage/_version.py"]
fail_under = 100

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["botocore.*", "pycognito.*"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports         = true
force-sort-within-sections = true
